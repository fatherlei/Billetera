<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--tx:#1a1a1a;--mu:#6b6b6b;--ln:#e6e6e6;--cd:#fafafa;--ok:#15803d;--ko:#b91c1c;--in:#1d4ed8;--wn:#fff7e0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#121212;--tx:#eee;--mu:#9a9a9a;--ln:#2c2c2c;--cd:#1a1a1a;--ok:#4ade80;--ko:#f87171;--in:#7aa2ff;--wn:#2a2410}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#121212;--tx:#eee;--mu:#9a9a9a;--ln:#2c2c2c;--cd:#1a1a1a;--ok:#4ade80;--ko:#f87171;--in:#7aa2ff;--wn:#2a2410}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.35 'DM Sans',system-ui,sans-serif}
.w{max-width:760px;margin:0 auto;padding:10px}
nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin-bottom:10px;width:100%;overflow:visible}nav button{min-width:0;white-space:normal;display:flex;align-items:center;justify-content:center;gap:5px;padding:7px 4px;text-align:center}
button,input,select,textarea{font:inherit;font-size:12px;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:6px;padding:5px 8px;box-sizing:border-box}
input,select,textarea{width:100%}
button{cursor:pointer}nav button.on,.pri{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.c{border:1px solid var(--ln);border-radius:8px;padding:8px;margin-bottom:8px;background:var(--cd)}
h2{font-size:14px;margin:0 0 6px}h3{font-size:11px;font-weight:500;color:var(--mu);margin:8px 0 4px}
.r{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px solid var(--ln)}.r:last-child{border:0}
.mu{color:var(--mu);font-size:11px}.ok{color:var(--ok)}.ko{color:var(--ko)}.in{color:var(--in)}.b{font-weight:700}
.wn{background:var(--wn);border:1px solid var(--ln);border-radius:8px;padding:6px 8px;margin-bottom:8px;font-size:12px}
summary{cursor:pointer;display:flex;justify-content:space-between;gap:8px;padding:4px 0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}.cal button{padding:4px 0;min-height:34px}.cal .sel{background:var(--tx);color:var(--bg)}
.dot{display:inline-block;width:5px;height:5px;border-radius:50%;margin:0 1px}
label{display:block;font-size:11px;color:var(--mu)}
:root{--fill:#f4f4f4}@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--fill:#242424}}:root[data-theme="dark"]{--fill:#242424}
button,input,select,textarea{border-radius:12px}.c{border-radius:22px;padding:14px}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hd{display:flex;align-items:center;gap:12px;padding:6px 2px 12px;border-bottom:1px solid var(--ln);margin-bottom:12px}.lg{width:42px;height:42px;border-radius:13px;background:#2b2b2b;color:#fff;display:grid;place-items:center}.lg .i{width:22px;height:22px}
.hd h1{font-size:18px;margin:0}.hd p{margin:0;color:var(--mu);font-size:12px}.hd button{margin-left:auto;width:44px;height:44px;padding:0;border-radius:15px;display:grid;place-items:center}
nav{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:6px}nav button{display:flex;align-items:center;gap:7px;white-space:nowrap;border:0;background:transparent;color:var(--mu);border-radius:15px;padding:11px 15px;font-size:13px}nav button.on{background:var(--fill);color:var(--tx)}
.q{border:1px solid var(--ln);border-radius:28px;padding:18px;margin-bottom:12px}.ey{font-size:11px;letter-spacing:.14em;color:var(--mu)}.q h2{font-size:22px;margin:3px 0 0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--fill);border-radius:18px;padding:5px;margin:14px 0 4px}.seg button{border:0;background:transparent;border-radius:14px;padding:11px 0;color:var(--mu);font-size:14px}.seg button.on{background:var(--bg);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.q label{font-weight:700;margin:14px 0 6px;font-size:12px}.q input,.q select{background:var(--fill);border:0;border-radius:16px;padding:13px 14px;font-size:14px}
.amt{display:flex;align-items:center;gap:8px;border:1px solid var(--ln);border-radius:20px;padding:4px 16px}.amt span{font-size:20px;color:var(--mu);font-weight:700}.amt input{background:transparent;font-size:22px;padding:10px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips button{border-radius:999px;padding:8px 14px;background:transparent;color:var(--mu)}.chips button.on{background:var(--fill);color:var(--tx);border-color:var(--tx)}
.mb{display:flex;align-items:center;justify-content:space-between;gap:6px;border-radius:18px;padding:16px 12px;color:var(--mu);text-align:left;min-width:0;font-size:13px}.mb>span{min-width:0}.mb>span>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.big{width:100%;border:0;border-radius:20px;padding:18px;font-size:16px;color:#fff;background:#9e9e9e;margin-top:16px;display:flex;justify-content:center;align-items:center;gap:10px}.big.ready{background:var(--tx);color:var(--bg)}
.t{border-radius:20px;padding:11px 12px;background:var(--tile-bg,var(--cd));border:1px solid var(--ln)}.t b{display:block;font-size:20px;margin:5px 0}.t1{--tile-bg:#edf7f0;color:#167444}.t2{--tile-bg:#eef2ff;color:#3455b4}.t3{--tile-bg:#fff0ef;color:#b93832}
.t>div{font-size:11px}.t>div:last-child{font-size:10px;color:var(--mu)}.t b{color:inherit}
.q{padding:14px;border-radius:22px}.q h2{font-size:18px}.q label{font-size:11px}.q input,.q select{font-size:13px;padding:10px 12px}.seg button{font-size:13px;padding:9px 0}
.mc{font-size:10px;white-space:nowrap;min-width:0;overflow:hidden;padding:7px 6px;gap:5px}.mc>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}.mc .i{width:15px;height:15px;flex:none}
.mg{gap:5px}.qc{padding:10px;border-radius:20px}.qc .lb{font-size:10px}
.bd{background:#e8dfc9;color:#8a6a2a;border-radius:999px;padding:6px 14px;font-weight:500}
.hd{padding:2px 2px 8px;margin-bottom:8px}.lg{width:36px;height:36px;border-radius:11px}.lg .i{width:20px;height:20px}.hd h1{font-size:16px}.hd p{font-size:11px}.hd button{width:38px;height:38px;border-radius:13px}nav{margin-bottom:8px}nav button{padding:8px 12px}
.qc{border:1px solid var(--ln);border-radius:24px;padding:12px;margin-bottom:10px}.qc .seg{margin:0 0 10px}.qc .seg button{padding:9px 0}
.qc input,.qc select{background:var(--fill);border:0;border-radius:14px;padding:11px 12px;font-size:14px;min-width:0}.qc label{display:block;font-size:10.5px;font-weight:500;color:var(--mu);margin:0 0 3px 4px}
.r2{display:grid;grid-template-columns:3fr 2fr;gap:8px;margin-bottom:10px}.r3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.lb{font-size:11px;font-weight:700;color:var(--mu);margin:0 0 5px 2px}.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.mc{display:flex;align-items:center;justify-content:flex-start;gap:6px;border-radius:14px;padding:8px;min-height:46px;font-size:11.5px;line-height:1.15;text-align:left;color:var(--mu)}.mc .i{width:16px;height:16px}
.qc .big{margin-top:2px;padding:14px;font-size:15px}

/* Mejoras de lectura y jerarquía visual */
.day-head{font-size:12px;font-weight:700;color:var(--mu);padding:13px 4px 6px;letter-spacing:.02em}
.mv-list{display:flex;flex-direction:column;gap:7px}
.mv-item{position:relative;overflow:hidden;border:0;border-bottom:1px solid var(--ln);border-radius:0;background:transparent;touch-action:pan-y;box-shadow:none}
.mv-actions{position:absolute;inset:0 0 0 auto;width:116px;display:flex;align-items:stretch;z-index:0;visibility:hidden;opacity:0;pointer-events:none;transition:opacity .15s ease}
.mv-item.open .mv-actions{visibility:visible;opacity:1;pointer-events:auto}
.mv-actions button{border:0;border-radius:0;flex:1 1 58px;width:58px;min-width:0;padding:0 3px;color:#fff;font-size:11px;font-weight:700;white-space:nowrap}
.mv-actions .edit-act{background:#64748b}.mv-actions .del-act{background:#b91c1c}
.mv-content{position:relative;z-index:1;width:100%;box-sizing:border-box;background:var(--bg);display:flex;align-items:center;gap:14px;padding:13px 12px;min-height:64px;transition:transform .18s ease;will-change:transform}
.mv-icon{width:25px;height:25px;flex:none;display:grid;place-items:center;background:transparent;color:var(--mu)}
.mv-icon svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mv-main{min-width:0;flex:1}.mv-title{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mv-meta{font-size:11px;color:var(--mu);margin-top:4px}
.mv-amount{font-size:14px;font-weight:700;white-space:nowrap;text-align:right}.mv-amount.out{color:var(--ko)}.mv-amount.in{color:var(--ok)}
.mv-item.open .mv-content{transform:translateX(-116px)}
.mv-list{padding:0 4px}
.mv-filters{display:flex;gap:8px;overflow-x:auto;white-space:nowrap;padding:5px 1px 9px;scrollbar-width:thin;overscroll-behavior-x:contain}
.mv-filters button{flex:0 0 auto;min-width:112px;border-radius:22px;padding:9px 14px;background:var(--cd);border:1px solid var(--ln)}
.mv-filters button.pri{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.card-grid{display:grid;grid-template-columns:1fr;gap:10px}
.bank-card{position:relative;overflow:hidden;border:0;border-radius:19px;padding:13px 15px;color:#fff;background:var(--card-color,#334155);box-shadow:0 4px 12px rgba(0,0,0,.09)}
.bank-card:after{content:'';position:absolute;width:125px;height:125px;border:1px solid rgba(255,255,255,.18);border-radius:50%;right:-42px;top:-72px;box-shadow:0 0 0 15px rgba(255,255,255,.045),0 0 0 30px rgba(255,255,255,.035);pointer-events:none}
.bank-card>summary{display:block;list-style:none;padding:0;position:relative;z-index:1}.bank-card>summary::-webkit-details-marker{display:none}
.bank-top{display:flex;justify-content:space-between;gap:8px;align-items:center;position:relative;z-index:1}.bank-name{font-size:13px;font-weight:700;line-height:1.2}.bank-chip{border:1px solid rgba(255,255,255,.4);border-radius:7px;padding:2px 6px;font-size:9px}
.bank-balance{position:relative;z-index:1;margin:8px 0 8px}.bank-balance small{display:block;color:rgba(255,255,255,.78);font-size:9px}.bank-balance strong{font-size:25px;line-height:1.12;display:block;margin-top:1px}
.bank-foot{display:flex;flex-wrap:nowrap;align-items:center;gap:14px;position:relative;z-index:1;white-space:nowrap;overflow:hidden}.bank-foot>div{display:flex;align-items:center;gap:4px;min-width:0}.bank-foot small{display:inline;color:rgba(255,255,255,.78);font-size:9px}.bank-foot b{font-size:10px;display:inline;margin:0}
.bank-progress{position:relative;z-index:1;margin-top:8px}.bank-progress .bank-top small,.bank-progress .bank-top b{font-size:9px;color:rgba(255,255,255,.85)}
.installment-track{height:6px;border-radius:8px;background:rgba(255,255,255,.25);overflow:hidden;margin-top:7px}.installment-track span{height:100%;display:block;background:#fff;border-radius:8px}
.proj-chart{border:1px solid var(--ln);border-radius:20px;padding:14px;background:var(--cd);margin-bottom:12px}.proj-bars{height:145px;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:5px;align-items:end;margin-top:12px}.proj-col{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;min-width:0}.proj-bar{width:100%;min-height:3px;border-radius:6px 6px 2px 2px;background:#94a3b8;position:relative}.proj-col.heavy .proj-bar{background:var(--ko)}.proj-month{font-size:9px;color:var(--mu)}.proj-value{font-size:9px;color:var(--mu);white-space:nowrap;transform:rotate(-45deg);transform-origin:center}

.verify-review{padding:12px}.verify-review-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.verify-count{background:var(--fill);border-radius:999px;padding:5px 10px;font-size:12px}
.verify-item{border:1px solid var(--ln);border-radius:14px;padding:8px;margin:7px 0;background:var(--bg)}
.verify-quota{padding:4px 3px}.verify-quota-title{display:flex;justify-content:space-between;gap:8px;font-size:12px}.verify-quota-title span{color:var(--mu)}.verify-quota-meta,.verify-quota-total{font-size:10px;color:var(--mu);margin-top:4px}
.verify-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:8px}.verify-confirm,.verify-edit,.verify-back{font-size:11px;padding:7px 10px;border-radius:10px;border:1px solid var(--ln)}
.verify-confirm{background:var(--tx);color:var(--bg);border-color:var(--tx);font-weight:700}.verify-edit{background:var(--fill)}.verify-back{margin-top:10px;background:var(--fill)}
.verify-banner{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;margin:0 0 10px;border:1px solid var(--ln);border-radius:14px;background:var(--fill);font-size:11px;color:var(--mu)}.verify-banner button{border:0;background:transparent;font-weight:700;color:var(--tx);padding:5px}
@media(min-width:560px){.card-grid{grid-template-columns:1fr 1fr}}

.pay-trigger{cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;gap:5px;min-width:0}.pay-trigger>b{font-size:22px;line-height:1.15;white-space:nowrap}.pay-trigger>div:first-child{font-size:13px}.pay-trigger>div:last-child{font-size:11px;display:flex;align-items:center;gap:3px}.pay-trigger .i{width:14px;height:14px;flex:none}.pay-trigger:focus-visible{outline:2px solid var(--ac);outline-offset:2px}.pay-detail .r b,.c>.r b{font-size:12px}.pay-detail .r span,.c>.r span{font-size:12px}
/* Ajuste compacto exclusivo para la lista de movimientos */
.mv-list{display:flex!important;flex-direction:column!important;gap:0!important;padding:0 4px!important}
.mv-list .mv-item{display:block!important;height:auto!important;min-height:0!important;margin:0!important;padding:0!important;border:0!important;border-bottom:1px solid var(--ln)!important;border-radius:0!important;background:transparent!important;box-shadow:none!important}
.mv-list .mv-content{display:flex!important;align-items:center!important;gap:11px!important;min-height:0!important;height:auto!important;padding:9px 8px!important;margin:0!important;background:transparent!important}
.mv-list .mv-icon{width:22px!important;height:22px!important;min-width:22px!important;padding:0!important;margin:0!important;background:transparent!important}
.mv-list .mv-icon svg{width:19px!important;height:19px!important}
.mv-list .mv-main{min-width:0!important;flex:1 1 auto!important}
.mv-list .mv-title{font-size:13px!important;line-height:1.25!important;margin:0!important;padding:0!important}

<div class="mes-b ${sel.libre>=0?'ok':'ko'}" style="text-align:center">${f0(sel.libre)}</div><div class="mu" style="text-align:center">${sel.libre>=0?'Libre para gastar':'Te pasás de tus ingresos'}</div>
<div class="mbar ${sel.libre<0?'over':''}"><i style="width:${ing>0?Math.min(100,Math.round(com/ing*100)):100}%"></i></div>
<div class="mleg"><span><i style="background:${sel.libre<0?'var(--ko)':'var(--tx)'}"></i>Comprometido ${f0(com)}</span><span><i style="background:var(--ok)"></i>Ingresos ${f0(ing)}</span></div>
<h3>Cómo se reparte</h3>${perCard.map(x=>`<div class="r"><span><i class="pj-dot" style="background:${x.a.c}"></i>${E(x.a.n)}</span><b>${f0(x.v)}</b></div>`).join('')}<div class="r"><span>Gastos fijos</span><b>${f0(fx)}</b></div>
<details style="margin-top:6px"><summary><span class="mu">Ver detalle de ${mn(sel.k)}</span></summary>${cuS.map(c=>`<div class="r"><span>${E(ac(c.a).n)} · ${E(c.d)}<div class="mu">cuota ${c.k}/${c.t}${c.v?' · Sin verificar':''}</div></span><b>${fm(c.m)}</b></div>`).join('')}${mvS.map(m=>`<div class="r"><span>${E(ac(m.a).n)} · ${E(m.d)}<div class="mu">${m.tp==='reintegro'?'reintegro':m.tp==='cargo'?'cargo o impuesto':'consumo'}</div></span><b class="${m.tp==='reintegro'?'ok':''}">${m.tp==='reintegro'?'+':''}${fm(m.m)}</b></div>`).join('')}${usd.length?`<div class="r"><span>Consumos en USD</span><b>${fm(sum(usd,m=>SG[m.tp]*m.m),'USD')}</b></div>`:''}<div class="r"><b>Total tarjetas</b><b>${fm(sel.tot)}</b></div></details></div>
${el.length?`<div class="c"><h2>Cuándo se alivian las cuotas</h2>${el.map(k=>{const L=ends[k],t=sum(L,c=>c.m);return`<div class="r"><span>${mn(k)} · ${L.length>1?L.length+' cuotas terminan':'1 cuota termina'}<div class="mu">${E(L.slice(0,2).map(c=>c.d).join(', '))}${L.length>2?' y '+(L.length-2)+' más':''}</div></span><b class="ok">−${f0(t)}/mes</b></div>`}).join('')}<div class="mu">Desde el mes siguiente a cada fecha pagás ese importe menos por mes.</div></div>`:''}
<div class="mu" style="margin:0 2px 9px">Incluye cuotas y consumos cargados. Los ingresos son los estimados de Configuración. Los USD se convierten con la cotización guardada.</div>`}
function vCfg(){const c=D.cfg;return`<div class="c"><h2>Ingresos y gastos fijos</h2><div class="g2"><div><label>Sueldo mensual</label><input inputmode="decimal" value="${c.sueldo}" onchange="D.cfg.sueldo=parseFloat(this.value)||0;save()"></div><div><label>Otros ingresos previstos</label><input inputmode="decimal" value="${c.extra}" onchange="D.cfg.extra=parseFloat(this.value)||0;save()"></div></div>
${c.fijos.map((x,i)=>`<div class="g2" style="margin-top:6px"><input value="${E(x[0])}" onchange="D.cfg.fijos[${i}][0]=this.value;save()"><div style="display:flex;gap:4px"><input inputmode="decimal" value="${x[1]}" onchange="D.cfg.fijos[${i}][1]=parseFloat(this.value)||0;save()"><button onclick="D.cfg.fijos.splice(${i},1);save();go()">✕</button></div></div>`).join('')}
<button style="margin-top:6px" onclick="D.cfg.fijos.push(['Nuevo gasto',0]);save();go()">Agregar gasto fijo</button></div>
<div class="c"><h2>Dólar</h2><p class="mu" style="margin:0 0 8px">Los gastos en USD se convierten con esta cotización${D.cfg.usd.f?' (al '+D.cfg.usd.f.split('-').reverse().join('/')+')':''}.</p><div class="g2"><select onchange="D.cfg.usd.tipo=this.value;save();if(this.value!=='manual')updUsd();else go()">${[['tarjeta','Dólar tarjeta'],['oficial','Dólar oficial'],['blue','Dólar blue'],['manual','Manual']].map(x=>`<option value="${x[0]}" ${D.cfg.usd.tipo===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select><input inputmode="decimal" value="${D.cfg.usd.v}" onchange="Object.assign(D.cfg.usd,{v:parseFloat(this.value.replace(',','.'))||0,tipo:'manual',f:today});save();go()"></div><button style="margin-top:6px" onclick="updUsd()">Actualizar ahora</button></div>
<div class="c"><h2>Categorías</h2><input value="${E(D.cats.join(', '))}" onchange="D.cats=this.value.split(',').map(s=>s.trim()).filter(Boolean);save()"></div>
<div class="c"><h2>Copia de seguridad</h2><p class="mu">Los datos se guardan en este navegador. Copiá el texto de la copia y guardalo en un lugar seguro. No hay sincronización bancaria.</p>
<button onclick="D.cfg.bk=today;save();exp=JSON.stringify(D);go()">Generar copia</button> <button onclick="exp='';go()">Limpiar</button>
<textarea id="bk" rows="5" placeholder="Pegá acá una copia para importarla">${E(exp)}</textarea><button class="pri" style="margin-top:6px" onclick="imp()">Importar copia</button>
<button style="margin-top:6px" onclick="if(confirm('Se borran todos tus datos y la app queda vacía. ¿Seguro?')){D=seed();save();go()}">Restablecer datos iniciales</button></div>`}
function verifyCount(){return D.cu.filter(c=>c.v).length+D.mv.filter(m=>m.v).length}
function showVerify(){tab='mov';flt='todos';go();const el=$('#v');if(!el)return;
const ms=D.mv.filter(m=>m.v),cs=D.cu.filter(c=>c.v);
el.innerHTML=`<div class="c verify-review"><div class="verify-review-head"><div><h2>Datos pendientes de verificar</h2><div class="mu">Revisá la información recuperada antes de confirmarla.</div></div><b class="verify-count">${ms.length+cs.length}</b></div>
${ms.length?`<h3>Movimientos</h3>${ms.map(m=>`<div class="verify-item">${row(m,1)}<button class="verify-confirm" onclick="confirmVerify('mv','${m.id}')">Confirmar movimiento</button></div>`).join('')}`:''}
${cs.length?`<h3>Cuotas</h3>${cs.map(c=>`<div class="verify-item"><div class="verify-quota"><div class="verify-quota-title"><b>${E(c.d)}</b><span>${E(ac(c.a).n)}</span></div><div class="verify-quota-meta">Cuota ${c.n}/${c.t} · ${kName(c.f)} · ${fm(c.m)} por cuota</div><div class="verify-quota-total">Importe original: ${fm(c.tot||c.m*c.t)}</div></div><div class="verify-actions"><button class="verify-edit" onclick="editQuotaVerify('${c.id}')">Corregir</button><button class="verify-confirm" onclick="confirmVerify('cu','${c.id}')">Confirmar datos</button></div></div>`).join('')}`:''}
${!ms.length&&!cs.length?'<div class="mu">No quedan datos pendientes de verificar.</div>':''}
<button class="verify-back" onclick="tab='mov';go()">Volver a movimientos</button></div>`;enableSwipe()}
function confirmVerify(type,i){const list=type==='cu'?D.cu:D.mv;const item=list.find(x=>x.id===i);if(!item)return;item.v=false;save();if(verifyCount()===0){go();toast('Todos los datos fueron verificados')}else showVerify()}
function editQuotaVerify(i){const c=D.cu.find(x=>x.id===i);if(!c)return;
const d=prompt('Descripción de la compra:',c.d);if(d===null)return;
const m=prompt('Importe de cada cuota:',String(c.m));if(m===null)return;
const n=prompt('Número de cuota actual:',String(c.n));if(n===null)return;
const t=prompt('Cantidad total de cuotas:',String(c.t));if(t===null)return;
const amount=Number(String(m).replace(',','.')),num=Number(n),total=Number(t);
if(!d.trim()||!(amount>0)||!Number.isInteger(num)||!Number.isInteger(total)||num<1||total<num){alert('Revisá los datos: el importe debe ser mayor a cero y la cuota actual no puede superar el total.');return}
c.d=d.trim();c.m=amount;c.n=num;c.t=total;c.tot=c.tot||amount*total;save();showVerify();toast('Cuota corregida. Ahora podés confirmarla')}
function enableSwipe(){document.querySelectorAll('.mv-item').forEach(el=>{let x=0,dx=0,active=false,ignoreClickUntil=0;const content=el.querySelector('.mv-content');content.addEventListener('touchstart',e=>{x=e.touches[0].clientX;dx=0;active=true},{passive:true});content.addEventListener('touchmove',e=>{if(!active)return;dx=Math.min(0,Math.max(-116,e.touches[0].clientX-x));content.style.transform=`translateX(${dx}px)`},{passive:true});content.addEventListener('touchend',()=>{if(!active)return;active=false;if(dx<-55){el.classList.add('open');ignoreClickUntil=Date.now()+450}else if(dx>25)el.classList.remove('open');content.style.transform=''});content.addEventListener('click',()=>{if(Date.now()<ignoreClickUntil)return;if(el.classList.contains('open'))el.classList.remove('open')})})}
function go(){$('#lg').innerHTML=ic('wallet');$('#gr').innerHTML=ic('sliders');$('#nav').innerHTML=TABS.filter(t=>t[0]!=='cfg').map(t=>`<button class="${tab===t[0]?'on':''}" onclick="tab='${t[0]}';go()">${ic(TI[t[0]])}${t[1]==='Tarjetas y cuentas'?'Tarjetas':t[1]}</button>`).join('');
$('#v').innerHTML={inicio:vInicio,mov:vMov,cuentas:vCuentas,cal:vCal,res:vRes,cfg:vCfg}[tab]();const n=verifyCount();if(n)$('#v').insertAdjacentHTML('afterbegin',`<div class="verify-banner"><span><b>${n} datos sin verificar</b> · Revisá los datos recuperados</span><button onclick="showVerify()">Revisar →</button></div>`);enableSwipe()}
function add(){const wasEd=!!edit,m=parseFloat(String(F.m).replace(',','.'));if(!F.d||!(m>0)){alert('Completá la descripción y un importe mayor a cero.');return}
if(edit){Object.assign(D.mv.find(q=>q.id===edit),{tp:F.tp,d:F.d,m,mo:F.mo,cat:F.cat,f:F.f,a:F.a});edit=null}
else if(F.tp==='gasto'&&+F.n>1&&isC(F.a))D.cu.push({id:id(),a:F.a,d:F.d,n:1,t:+F.n,m:Math.round(m/F.n*100)/100,f:stm(F.a,F.f),cat:F.cat,pf:F.f,tot:m});
else D.mv.push({id:id(),tp:F.tp,d:F.d,m,mo:F.mo,cat:F.cat,f:F.f,a:F.a,src:F.src||null});
const p=parseFloat(F.pc);if(F.tp==='gasto'&&p>0){let r=m*p/100;const t=parseFloat(F.tope);if(t>0)r=Math.min(r,t);D.mv.push({id:id(),tp:'reintegro',d:'Reintegro '+F.d,m:Math.round(r*100)/100,mo:F.mo,cat:F.cat,f:F.f,a:F.a})}
F={...F,d:'',m:'',pc:'',tope:'',n:1};save();tab=wasEd?'mov':'inicio';go();toast(wasEd?'Cambios guardados':'Movimiento agregado')}
function ed(i){const m=D.mv.find(x=>x.id===i);F={...F,tp:m.tp,d:m.d,m:m.m,mo:m.mo,cat:m.cat,f:m.f,a:m.a,n:1};edit=i;tab='inicio';go()}
function del(i){if(confirm('¿Eliminar este movimiento?')){D.mv=D.mv.filter(x=>x.id!==i);save();go()}}
function delc(i){if(confirm('¿Eliminar esta compra en cuotas?')){D.cu=D.cu.filter(x=>x.id!==i);save();go()}}
function up(i,k,v){ac(i)[k]=v;save();if(k==='n'||k==='c')go()}
function adda(){const n=$('#an').value.trim();if(!n)return;D.acc.push({id:id(),n,t:$('#at').value,c:'#6b7280',s0:0,cierre:null,vto:null});save();go()}
function dela(i){if(confirm('¿Eliminar este medio y sus movimientos y cuotas?')){D.acc=D.acc.filter(a=>a.id!==i);D.mv=D.mv.filter(m=>m.a!==i);D.cu=D.cu.filter(c=>c.a!==i);save();go()}}
function imp(){try{const x=JSON.parse($('#bk').value);if(!x.acc||!x.mv||!x.cu)throw 0;D=x;save();go();alert('Copia importada.')}catch(e){alert('No se pudo leer la copia. Revisá que el texto esté completo.')}}
async function updUsd(q){const u=D.cfg.usd;if(u.tipo==='manual'){toast('Elegí un tipo de dólar para actualizar');return}try{const r=await fetch('https://dolarapi.com/v1/dolares/'+u.tipo),j=await r.json();if(!(j.venta>0))throw 0;u.v=j.venta;u.f=today;save();go();if(!q)toast('Dólar actualizado')}catch(e){if(!q)toast('No se pudo actualizar. Cargalo a mano en Configuración.')}}
let catAll=false;
const daysTo=d=>{const n=new Date(),y=n.getFullYear(),m=n.getMonth(),t=n.getDate(),dim=(yy,mm)=>new Date(yy,mm+1,0).getDate();let dt=new Date(y,m,Math.min(d,dim(y,m)));if(d<t)dt=new Date(y,m+1,Math.min(d,dim(y,m+1)));return Math.round((dt-new Date(y,m,t))/864e5)};
function heroB(){const L=D.acc.filter(a=>a.t!=='tarjeta'),tot=sum(L,a=>balanceCuenta(a.id)),sh=L.filter(a=>a.id==='mp'||a.id==='nx'||balanceCuenta(a.id)!==0);
return`<div class="hero"><div class="hero-l"><span class="mu">Saldo disponible</span><b class="${tot<0?'ko':''}">${fm(tot)}</b></div><div class="hero-c">${sh.map(a=>`<span><i style="background:${a.c}"></i>${E(a.n)} <b>${f0(balanceCuenta(a.id))}</b></span>`).join('')}</div></div>`}
function dueB(){const ev=[];D.acc.filter(a=>a.t==='tarjeta').forEach(a=>{if(a.vto)ev.push([daysTo(+a.vto),a.n+' vence',a.c]);if(a.cierre)ev.push([daysTo(+a.cierre),a.n+' cierra',a.c])});ev.sort((x,y)=>x[0]-y[0]);
const when=n=>n===0?'hoy':n===1?'mañana':'en '+n+' días';
const pend=sum(D.cu,c=>(c.t-c.n+1)*c.m),lk=D.cu.reduce((mx,c)=>{const k=addM(c.f,c.t-c.n);return k>mx?k:mx},'');
const rows=ev.slice(0,3).map(e=>`<div><span><i style="background:${e[2]}"></i>${E(e[1])}</span><span class="${e[0]<=3?'soon':''}">${when(e[0])}</span></div>`).join('')+(D.cu.length?`<div><span>Cuotas pendientes</span><span><b>${f0(pend)}</b> <span class="mu">hasta ${kName(lk)}</span></span></div>`:'');
const bd=D.cfg.bk?Math.floor((new Date(today)-new Date(D.cfg.bk))/864e5):null;
const bk=bd===null||bd>7?`<div class="bkw"><span>${bd===null?'Todavía no hiciste una copia de respaldo.':'Hace '+bd+' días que no hacés una copia de respaldo.'}</span><button onclick="tab='cfg';go()">Hacer copia</button></div>`:'';
return(rows?`<div class="due">${rows}</div>`:'')+bk}
function rep(i){const m=D.mv.find(x=>x.id===i);if(!m)return;edit=null;F={...F,tp:m.tp==='cargo'?'gasto':m.tp,d:m.d,m:m.m,mo:m.mo,cat:m.cat||'Otros',f:today,a:m.a,n:1,pc:'',tope:'',src:m.src||''};go();window.scrollTo({top:0,behavior:'smooth'});toast('Cargado. Revisá y tocá Agregar')}
const _add=add;add=function(){window._pre={mv:new Set(D.mv.map(x=>x.id)),cu:new Set(D.cu.map(x=>x.id))};_add()};
const _toast=toast;
toast=function(t){const p=window._pre;if(t!=='Movimiento agregado'||!p)return _toast(t);window._pre=null;
const nm=D.mv.filter(x=>!p.mv.has(x.id)).map(x=>x.id),nc=D.cu.filter(x=>!p.cu.has(x.id)).map(x=>x.id);if(!nm.length&&!nc.length)return _toast(t);
const e=document.createElement('div');e.style.cssText='position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:7px 8px 7px 16px;border-radius:999px;font-size:13px;z-index:9;display:flex;align-items:center;gap:12px;white-space:nowrap';
e.innerHTML='<span>Movimiento agregado</span>';const b=document.createElement('button');b.textContent='Deshacer';b.style.cssText='border:0;background:rgba(128,128,128,.35);color:inherit;border-radius:999px;padding:6px 12px';
b.onclick=()=>{D.mv=D.mv.filter(x=>!nm.includes(x.id));D.cu=D.cu.filter(x=>!nc.includes(x.id));save();e.remove();go()};e.appendChild(b);document.body.appendChild(e);setTimeout(()=>e.remove(),5000)};
go();
if(D.cfg.usd.tipo!=='manual'&&D.cfg.usd.f!==today)updUsd(true);
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
